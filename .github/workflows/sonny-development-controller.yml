name: Sonny ONE development controller

on:
  workflow_dispatch:
  push:
    branches:
      - research/apl-001
    paths:
      - 'sonny_one/development_controller/**'
      - 'tests/test_sonny_one_development_controller.py'
      - '.github/workflows/sonny-development-controller.yml'

permissions:
  contents: read

concurrency:
  group: sonny-development-controller
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/apl-001
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate controller and approval boundaries
        run: python -m unittest discover -s tests -p 'test_sonny_one_development_controller.py' -v
      - name: Generate task plan without code execution
        run: |
          python -m sonny_one.development_controller.controller --output development-plan.json
          cat development-plan.json
      - name: Preserve inspectable plan
        uses: actions/upload-artifact@v4
        with:
          name: sonny-development-plan
          path: development-plan.json
          retention-days: 7
