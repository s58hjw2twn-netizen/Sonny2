name: MCP local spike verification
on:
  push:
    branches: [research/apl-001]
    paths:
      - 'sonny/mcp_local_spike.py'
      - 'tests/test_mcp_local_spike_contract.py'
      - '.github/workflows/mcp-local-spike.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install SDK and test dependencies
        run: python -m pip install 'mcp>=1.28,<2' 'pytest>=8,<9'
      - name: Verify local-only source contract
        run: python -m pytest -q tests/test_mcp_local_spike_contract.py
      - name: Verify SDK import and registered tool
        run: |
          python - <<'PY'
          from sonny.mcp_local_spike import mcp
          assert mcp.settings.host == "127.0.0.1"
          assert mcp.settings.stateless_http is True
          tools = __import__("asyncio").run(mcp.list_tools())
          assert [t.name for t in tools] == ["protocol_status"]
          print("SDK import and tool registration verified; no network handshake performed")
          PY
