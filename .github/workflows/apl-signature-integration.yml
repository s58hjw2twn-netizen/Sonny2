name: APL Ed25519 signature integration
on:
  push:
    branches: [research/apl-001]
    paths:
      - 'sonny_one/apl/external_holdout.py'
      - 'sonny_one/apl/signed_holdout.py'
      - 'tests/test_apl_signed_holdout.py'
      - 'tests/test_apl_signed_holdout_no_crypto.py'
      - '.github/workflows/apl-signature-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned signature verification dependency
        run: python -m pip install --disable-pip-version-check 'cryptography==44.0.2'
      - name: Execute real Ed25519 signature and tamper tests
        run: |
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_apl_signed_holdout*.py' -v
