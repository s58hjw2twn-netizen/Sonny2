name: MCP resource authorization tests
on:
  push:
    branches: [research/apl-001]
    paths:
      - 'sonny/mcp_resource_auth.py'
      - 'sonny/mcp_auth_boundary.py'
      - 'sonny/mcp_protected_local.py'
      - 'sonny/mcp_staging_entrypoint.py'
      - 'sonny/mcp_oauth_metadata.py'
      - 'sonny/mcp_oauth_discovery.py'
      - 'tests/test_mcp_resource_auth.py'
      - 'tests/test_mcp_auth_boundary.py'
      - 'tests/test_mcp_protected_local.py'
      - 'tests/test_mcp_oauth_metadata.py'
      - 'tests/test_mcp_oauth_discovery.py'
      - 'tests/test_mcp_asgi_lifespan.py'
      - 'tests/test_mcp_staging_entrypoint.py'
      - 'Dockerfile.mcp'
      - 'requirements-mcp.txt'
      - '.github/workflows/mcp-resource-auth.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auth-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install 'PyJWT[crypto]==2.10.1' 'pytest==8.3.4' 'mcp>=1.28,<2'
      - name: Run resource-token tests
        run: python -m pytest -q tests/test_mcp_resource_auth.py tests/test_mcp_auth_boundary.py tests/test_mcp_protected_local.py tests/test_mcp_oauth_metadata.py tests/test_mcp_oauth_discovery.py tests/test_mcp_asgi_lifespan.py tests/test_mcp_staging_entrypoint.py

  mcp-container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated MCP container without deployment
        run: docker build -f Dockerfile.mcp -t sonny-mcp-ci .
      - name: Verify image imports staging module
        run: docker run --rm --entrypoint python sonny-mcp-ci -c "import sonny.mcp_staging_entrypoint"
      - name: Verify image refuses to serve by default
        shell: bash
        run: |
          set +e
          output=$(docker run --rm sonny-mcp-ci 2>&1)
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "ERROR: gated container unexpectedly exited successfully"
            exit 1
          fi
          if [[ "$output" != *"MCP staging deployment is gated"* ]]; then
            echo "ERROR: container failed for an unexpected reason"
            exit 1
          fi
          echo "Verified: image does not start an MCP listener by default"

