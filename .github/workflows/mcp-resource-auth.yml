name: MCP resource authorization tests
on:
  push:
    branches: [research/apl-001]
    paths:
      - 'sonny/mcp_resource_auth.py'
      - 'sonny/mcp_auth_boundary.py'
      - 'sonny/mcp_protected_local.py'
      - 'sonny/mcp_oauth_metadata.py'
      - 'tests/test_mcp_resource_auth.py'
      - 'tests/test_mcp_auth_boundary.py'
      - 'tests/test_mcp_protected_local.py'
      - 'tests/test_mcp_oauth_metadata.py'
      - '.github/workflows/mcp-resource-auth.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auth-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install 'PyJWT[crypto]==2.10.1' 'pytest==8.3.4' 'mcp>=1.28,<2'
      - name: Run resource-token tests
        run: python -m pytest -q tests/test_mcp_resource_auth.py tests/test_mcp_auth_boundary.py tests/test_mcp_protected_local.py tests/test_mcp_oauth_metadata.py
