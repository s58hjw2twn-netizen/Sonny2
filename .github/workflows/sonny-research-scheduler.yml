name: Sonny ONE research scheduler

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: sonny-research-scheduler
  cancel-in-progress: false

jobs:
  dispatch-research-inspection:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Dispatch bounded research-branch controller
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$GH_REPOSITORY" = "s58hjw2twn-netizen/Sonny2"
          curl --fail-with-body --silent --show-error --max-time 20 \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GH_REPOSITORY/actions/workflows/sonny-development-controller.yml/dispatches" \
            -d '{"ref":"research/apl-001"}'
