name: Sonny ONE research scheduler

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonny-research-scheduler
  cancel-in-progress: false

jobs:
  inspect-research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout isolated research branch
        uses: actions/checkout@v4
        with:
          ref: research/apl-001
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate controller boundaries
        run: python -m unittest discover -s tests -p 'test_sonny_one_development_controller.py' -v
      - name: Validate agent handoff
        run: python -m unittest discover -s tests -p 'test_sonny_one_agent_handoff.py' -v
      - name: Generate read-only task plan
        run: |
          python -m sonny_one.development_controller.controller --output development-plan.json
          python -m sonny_one.development_controller.controller --handoff --output coding-agent-handoff.json
          python -m sonny_one.development_controller.runner_preflight > runner-preflight.json
      - name: Preserve inspectable results
        uses: actions/upload-artifact@v4
        with:
          name: sonny-scheduled-research-plan
          path: |
            development-plan.json
            coding-agent-handoff.json
            runner-preflight.json
          retention-days: 7
