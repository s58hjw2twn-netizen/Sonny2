name: Sonny authentication regression

on:
  push:
    branches:
      - research/apl-001
    paths:
      - "sonny/**"
      - "tests/test_auth_boundary_regression.py"
      - "requirements.txt"
      - ".github/workflows/auth-regression.yml"
  pull_request:
    paths:
      - "sonny/**"
      - "tests/test_auth_boundary_regression.py"
      - "requirements.txt"
      - ".github/workflows/auth-regression.yml"

permissions:
  contents: read

jobs:
  authentication:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install locked application dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile authentication modules
        run: python -m compileall -q sonny/app.py sonny/store.py
      - name: Run authentication boundary regression tests
        run: python -m pytest -q tests/test_auth_boundary_regression.py
