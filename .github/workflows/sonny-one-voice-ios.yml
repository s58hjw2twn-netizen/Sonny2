name: Sonny ONE Voice iOS verification (manual)
# Manual only: macOS hosted runners may consume billable minutes.
# Do not dispatch without confirming runner entitlement/cost and owner approval.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  voice-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest==8.3.4
      - name: Run voice tests
        run: python -m pytest -q tests/test_sonny_one_voice_adapter.py tests/test_sonny_one_voice_engines.py
  ios-compile:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Check out upstream Moshi Swift at reviewed commit
        uses: actions/checkout@v4
        with:
          repository: kyutai-labs/moshi-swift
          ref: df64ffdbe224e1ecb1ade1d254f347d379ed7f7a
          persist-credentials: false
      - name: Report toolchain and source
        run: |
          xcodebuild -version
          git rev-parse HEAD
      - name: Resolve Xcode project dependencies
        run: xcodebuild -resolvePackageDependencies -project moshi.xcodeproj -scheme Moshi
      - name: Compile for iOS simulator without signing
        run: |
          xcodebuild -project moshi.xcodeproj -scheme Moshi -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
