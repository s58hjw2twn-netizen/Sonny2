name: Sonny ONE Voice iOS verification (manual)
# Manual only: macOS hosted runners may consume billable minutes.
# Do not dispatch without confirming runner entitlement/cost and owner approval.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonny-voice-ios-build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Check out Sonny ONE Voice (no persisted credentials)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify pinned upstream Moshi Swift reference
        uses: actions/checkout@v4
        with:
          repository: kyutai-labs/moshi-swift
          ref: df64ffdbe224e1ecb1ade1d254f347d379ed7f7a
          path: upstream-moshi-swift
          persist-credentials: false
      - name: Confirm upstream commit and Xcode version
        run: |
          test "$(git -C upstream-moshi-swift rev-parse HEAD)" = "df64ffdbe224e1ecb1ade1d254f347d379ed7f7a"
          xcodebuild -version
      - name: Run portable Swift voice tests
        run: swift test --package-path ios/SonnyVoiceCore
      - name: Generate Sonny iOS project
        run: |
          brew install xcodegen
          xcodegen generate --spec ios/project.yml --project ios
      - name: Compile actual Sonny Voice app for iOS Simulator (no signing)
        run: |
          xcodebuild -project ios/SonnyVoice.xcodeproj \
            -scheme SonnyVoice \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath /tmp/sonny-voice-derived \
            CODE_SIGNING_ALLOWED=NO build
# Upstream Moshi is pinned for provenance, not linked as an inference engine.
# Simulator compilation does not prove microphone, playback, or model inference.
