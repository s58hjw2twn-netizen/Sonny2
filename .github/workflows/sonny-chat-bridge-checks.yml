name: Sonny Chat Bridge Phase 1 checks

on:
  push:
    branches: [research/sonny-chat-bridge-phase1]
    paths:
      - 'sonny_one/chat_bridge.py'
      - 'sonny_one/chat_bridge_mcp.py'
      - 'tests/test_sonny_one_chat_bridge_mcp.py'
      - 'sonny_one/capability_inventory.py'
      - 'tests/test_sonny_one_chat_bridge.py'
      - 'tests/test_sonny_one_chat_bridge_manifest.py tests/test_sonny_one_chat_bridge_mcp.py'
      - 'sonny_one/chat_bridge_manifest.json'
      - '.github/workflows/sonny-chat-bridge-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned application dependencies
        run: python -m pip install -r requirements.txt
      - name: Check syntax
        run: python -m compileall -q sonny_one/chat_bridge.py tests/test_sonny_one_chat_bridge.py
      - name: Run Chat Bridge security and contract tests
        run: python -m pytest -q tests/test_sonny_one_chat_bridge.py tests/test_sonny_one_chat_bridge_manifest.py
      - name: Run full deterministic suite
        run: |
          python -m pip install --disable-pip-version-check 'numpy==1.26.4' 'opencv-python-headless==4.10.0.84'
          python -m pytest -q
