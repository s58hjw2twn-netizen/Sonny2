name: Sonny research agent tests

on:
  push:
    branches:
      - research/apl-001
    paths:
      - "sonny/research_agent.py"
      - "tests/test_research_agent.py"
      - ".github/workflows/research-agent.yml"
  pull_request:
    paths:
      - "sonny/research_agent.py"
      - "tests/test_research_agent.py"
      - ".github/workflows/research-agent.yml"

permissions:
  contents: read

jobs:
  bounded-planner:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install pytest==8.3.4
      - name: Run deterministic agent boundary tests
        run: python -m pytest -q tests/test_research_agent.py
