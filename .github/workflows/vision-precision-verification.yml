name: Sonny Vision Precision Verification
on:
  push:
    branches:
      - research/reliability-gates-v2
    paths:
      - 'sonny_vision/**'
      - 'tests/test_precision_pipeline.py'
      - 'tests/test_precision_release_gate.py'
      - 'tests/test_review_preview.py'
      - '.github/workflows/vision-precision-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  precision-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated test dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow
      - name: Compile modules
        run: python -m compileall -q sonny_vision
      - name: Run precision pipeline regression tests
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_precision_pipeline.py' -v
      - name: Run precision release gate tests
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_precision_release_gate.py' -v
      - name: Run review preview tests
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_review_preview.py' -v
