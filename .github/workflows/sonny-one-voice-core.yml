name: Sonny ONE Voice portable verification

on:
  push:
    branches:
      - feature/sonny-one-voice-adapter-20261102
    paths:
      - 'ios/**'
      - 'scripts/sonny_voice_windows_preflight.ps1'
      - 'scripts/sonny_voice_isolation_probe.py'
      - 'scripts/sonny_voice_container_trial.sh'
      - 'scripts/sonny_voice_sandbox_executor.sh'
      - 'docs/SONNY_ONE_VOICE_WINDOWS11_SETUP.md'
      - 'sonny_one/voice_*.py'
      - 'tests/test_sonny_one_voice_*.py'
      - '.github/workflows/sonny-one-voice-core.yml'
  pull_request:
    paths:
      - 'ios/**'
      - 'scripts/sonny_voice_windows_preflight.ps1'
      - 'scripts/sonny_voice_isolation_probe.py'
      - 'scripts/sonny_voice_container_trial.sh'
      - 'docs/SONNY_ONE_VOICE_WINDOWS11_SETUP.md'
      - 'sonny_one/voice_*.py'
      - 'tests/test_sonny_one_voice_*.py'
      - '.github/workflows/sonny-one-voice-core.yml'

permissions:
  contents: read

jobs:
  portable-voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate Windows preflight script (PowerShell parser)
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/sonny_voice_windows_preflight.ps1).Path,
            [ref]$tokens, [ref]$parseErrors
          )
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host "Windows preflight PowerShell syntax valid"
      - name: Validate restricted-container trial shell syntax (no execution)
        run: bash -n scripts/sonny_voice_container_trial.sh
      - name: Inspect Docker availability and cached image digests (no pulls)
        shell: bash
        run: |
          if ! command -v docker >/dev/null 2>&1; then
            echo "Docker CLI unavailable on this runner"
            exit 0
          fi
          if ! docker info --format '{{.ServerVersion}}' >/dev/null 2>&1; then
            echo "Docker daemon unavailable on this runner"
            exit 0
          fi
          echo "Docker daemon available; listing only locally cached images"
          docker image ls --digests --format '{{.Repository}}@{{.Digest}}' | sort -u
          echo "No container trial executed; image approval remains required."

      - name: Assert sandbox speech executor fails closed
        run: |
          bash -n scripts/sonny_voice_sandbox_executor.sh
          set +e
          bash scripts/sonny_voice_sandbox_executor.sh
          code=$?
          set -e
          test "$code" -eq 77
      - name: Report Swift toolchain
        run: swift --version
      - name: Test portable Swift voice core
        run: swift test --package-path ios/SonnyVoiceCore
      - name: Syntax-parse native iOS sources (not an iOS build)
        run: swiftc -frontend -parse ios/SonnyVoiceApp/*.swift
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Python test runner
        run: python -m pip install pytest==8.3.4
      - name: Test Python voice boundaries
        run: |
          python -m pytest -q \
            tests/test_sonny_one_voice_adapter.py \
            tests/test_sonny_one_voice_engines.py \
            tests/test_sonny_one_voice_stream.py \
            tests/test_sonny_one_voice_pcm_convert.py \
            tests/test_sonny_one_voice_capture_gate.py \
            tests/test_sonny_one_voice_packet.py \
            tests/test_sonny_one_voice_packet_bridge.py \
            tests/test_sonny_one_voice_cross_language_contract.py \
            tests/test_sonny_one_voice_turn_coordinator.py \
            tests/test_sonny_one_voice_integrated_pipeline.py \
            tests/test_sonny_one_voice_runtime.py \
            tests/test_sonny_one_voice_pcm_contract.py \
            tests/test_sonny_one_voice_provider_boundary.py \
            tests/test_sonny_one_voice_engine_probe.py \
            tests/test_sonny_one_voice_live_trial.py \
            tests/test_sonny_one_voice_windows_preflight_contract.py \
            tests/test_sonny_one_voice_windows_engine_manifest.py \
            tests/test_sonny_one_voice_whisper_source_check.py \
            tests/test_sonny_one_voice_whisper_launch_gate.py \
            tests/test_sonny_one_voice_whisper_command.py \
            tests/test_sonny_one_voice_whisper_runner.py \
            tests/test_sonny_one_voice_isolation_policy.py \
            tests/test_sonny_one_voice_isolation_probe.py \
            tests/test_sonny_one_voice_container_evidence.py \
            tests/test_sonny_one_voice_container_trial_contract.py \
            tests/test_sonny_one_voice_trial_evidence_retention.py \
            tests/test_sonny_one_voice_trial_evidence_verifier.py
