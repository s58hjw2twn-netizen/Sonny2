name: Sonny ONE Tests
on:
  push:
    branches:
      - feature/sonny-one-foundation
    paths:
      - 'sonny_one/**'
      - 'sonny/**'
      - 'requirements.txt'
      - 'tests/**'
      - 'scripts/check_sonny_one_browser.py'
      - '.github/workflows/sonny-one-tests.yml'
  pull_request:
    paths:
      - 'sonny_one/**'
      - 'sonny/**'
      - 'requirements.txt'
      - 'tests/**'
      - 'scripts/check_sonny_one_browser.py'
      - '.github/workflows/sonny-one-tests.yml'
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Run complete deterministic suite
        run: python -m pytest -q
      - name: Check browser JavaScript syntax
        run: |
          node --check sonny_one/web/app.js
          node --check sonny_one/web/sw.js
          node --check tests/browser_sonny_one.cjs
