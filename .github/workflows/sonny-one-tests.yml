name: Sonny ONE Research Tests
on:
  push:
    branches:
      - feature/sonny-one-foundation
    paths:
      - 'sonny_one/**'
      - 'tests/test_sonny_one*.py'
      - '.github/workflows/sonny-one-tests.yml'
  pull_request:
    paths:
      - 'sonny_one/**'
      - 'tests/test_sonny_one*.py'
      - '.github/workflows/sonny-one-tests.yml'
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run isolated Sonny ONE tests
        run: python -m pytest -q tests/test_sonny_one.py tests/test_sonny_one_evolution.py
